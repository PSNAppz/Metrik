[package]
name = "metrik"
version = "1.0.0"
description = "Real-time GPU panel display"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "metrik_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-ico", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-autostart = "2"
tauri-plugin-store = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
nvml-wrapper = "0.10"
sysinfo = "0.35"
windows-sys = { version = "0.59", features = ["Win32_System_Diagnostics_Etw", "Win32_Foundation", "Win32_System_Time"] }
reqwest = { version = "0.12", features = ["json"] }
open = "5"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
